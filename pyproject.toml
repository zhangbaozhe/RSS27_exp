[project]
name = "rss27_exp"
version = "0.1.0"
description = "RSS 2027 trajectory-planning sensitivity experiments"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Baozhe Zhang", email = "email@baozhezhang.com" }]

dependencies = [
  "pivopt",
  "numpy>=2,<3",
  "torch==2.10.0",
  "jax==0.11.1",
  "matplotlib>=3.9",
  "scipy>=1.14",
  "mujoco==3.9.0",
]

[dependency-groups]
dev = ["pytest>=9.0.3", "ruff>=0.17.2,<0.18", "pre-commit>=4,<5"]

[tool.uv]
package = false
build-constraint-dependencies = [
  "torch==2.10.0+cpu; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
pivopt = { git = "ssh://git@github.com/zhangbaozhe/pivopt.git", rev = "016541046c7fd8224b056cc17b5d8d6c1f6f47a0" }
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["examples", "tests"]
junit_family = "legacy"
